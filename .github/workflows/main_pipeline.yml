name: AVAGAMYA Production-Grade CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality_gate:
    name: Multi-Stage Quality Gate
    runs-on: ubuntu-latest
    
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      VITE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000
      LANGSMITH_TRACING: 'false' # Disable tracing in CI unless secrets provided

    steps:
      - uses: actions/checkout@v4

      # 1. Environment & Dependency Discovery (Backend)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m spacy download en_core_web_sm

      # 2. Environment & Dependency Discovery (Frontend)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 3. Static Analysis (Quality Gate 1)
      - name: Lint Python (Static Analysis)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. 
          # For a "Hard Gate", we might want to be stricter, but let's start with syntax.
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: TypeScript Static Analysis
        run: npm run build # Alternatively: npx tsc --noEmit

      # 4. Backend Logic Tests (Quality Gate 2)
      - name: Run Pytest (Unit & Integration)
        run: |
          python -m pytest tests/test_backend_units.py
          python -m pytest tests/backend/test_symbolic_engine.py

      # 5. Service Orchestration for E2E
      - name: Start Backend Server
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          # Wait for backend to be ready
          until curl -s http://localhost:8000/docs > /dev/null; do
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Start Frontend (Vite)
        run: |
          npm run dev &
          # Wait for frontend to be ready
          until curl -s http://localhost:5173 > /dev/null; do
            echo "Waiting for frontend..."
            sleep 2
          done

      # 6. E2E Integration Tests (Quality Gate 3)
      - name: Run Playwright E2E Tests
        run: npx playwright test tests/frontend/integration.spec.ts --workers=1

      # 7. Final Cleanup (Implicit in GitHub Actions)
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
